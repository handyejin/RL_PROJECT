# Contextual Bandit 보고서 후보 설정: LinUCB

algorithm: bandit
district: 강남구

data:
  processed_dir: data/processed_seoul_all
  forecast_dir: data/forecast_by_gu
  capacity_path: data/processed/station_capacity.csv

training:
  total_timesteps: 170000
  eval_every_timesteps: 20000
  n_train_dates: 200
  split_mode: chronological
  tag: yaml_bandit_topk12
  device: cpu
  progress: true

state:
  future_mode: forecast_projected_travel
  future_horizon: 6

candidate_action:
  top_k: 12
  mode: forecast_imbalance
  travel_coef: 0.20
  zone_mode: static3
  zone_penalty: 1.0
  feature_mode: basic

bandit:
  alpha: 0.5
  l2: 1.0
  reward_scale: 0.01
